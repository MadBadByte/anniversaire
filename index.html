<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joyeux Anniversaire</title>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page">
    <main class="page__container">
        <h1 class="page__title">Joyeux Anniversaire <span class="page__name">Ana</span> !</h1>

        <div class="cake__wrapper">
            <div class="cake">
                <div class="cake__frame">
                    <img class="cake__image cake__image--1" src="img/frames/ana/1.jpg" alt="Gâteau étape 1">
                    <img class="cake__image cake__image--2" src="img/frames/ana/2.jpg" alt="Gâteau étape 2">
                    <img class="cake__image cake__image--3" src="img/frames/ana/3.jpg" alt="Gâteau étape 3">
                    <img class="cake__image cake__image--4" src="img/frames/ana/4.jpg" alt="Gâteau étape 4">
                </div>
                <div class="cake__blow-effect"></div>
            </div>
        </div>

        <button class="button">
            <img class="button__image button__image--normal" src="img/icons/button-none.png" alt="Souffler">
            <img class="button__image button__image--hover" src="img/icons/button-hover.png" alt="Souffler (survol)">
            <img class="button__image button__image--active" src="img/icons/button-active.png" alt="Souffler (clic)">
        </button>

        <div class="message">
            <h2 class="message__title">Félicitations Ana ! 🎉</h2>
            <p class="message__text">Tous tes vœux se réaliseront !</p>
        </div>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
